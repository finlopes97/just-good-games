backend:
  name: git-gateway
  branch: main
media_folder: "public/images/posts"
public_folder: "/images/posts"
collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "src/content/posts"
    create: true
    format: "frontmatter"
    slug: "{{slug}}"
    extension: "md"
    # Uploads from the post editor go into src/assets/posts/ so astro:assets can optimise
    # them. The leading slash on media_folder means "from the repo root"; public_folder is
    # the path written into the post, relative to the post file in src/content/posts/.
    media_folder: "/src/assets/posts"
    public_folder: "../../assets/posts"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Game Title", name: "gameTitle", widget: "string", required: false }
      # Search-engine metadata only: nothing on the page renders from this. A post with
      # exactly one game gets VideoGame structured data. Leave it empty for list posts.
      - label: "Game data for search engines (optional)"
        name: "games"
        widget: "list"
        required: false
        collapsed: true
        hint: "Not shown on the page. Fill in for a post about one game; skip it for lists."
        label_singular: "Game"
        summary: "{{fields.name}}"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Pitch", name: "pitch", widget: "text", required: false, pattern: ['^[\s\S]{0,300}$', 'Keep the pitch to 300 characters or fewer'], hint: "1-2 sentences describing the game. Max 300 characters (longer fails the build)." }
          - { label: "Developer(s)", name: "developers", widget: "list", required: false }
          - { label: "Publisher(s)", name: "publishers", widget: "list", required: false }
          - { label: "Release Date", name: "releaseDate", widget: "string", required: false, hint: "Free text — e.g. '18 July 2024', '2024', or 'TBA'" }
          - label: "Store Links"
            name: "links"
            widget: "list"
            required: false
            label_singular: "Store Link"
            summary: "{{fields.store}}"
            fields:
              - label: "Store"
                name: "store"
                widget: "select"
                options:
                  - { label: "Steam", value: "steam" }
                  - { label: "itch.io", value: "itch" }
                  - { label: "GOG", value: "gog" }
                  - { label: "Epic Games", value: "epic" }
                  - { label: "PlayStation", value: "playstation" }
                  - { label: "Xbox", value: "xbox" }
                  - { label: "Nintendo", value: "nintendo" }
                  - { label: "Other / official site", value: "other" }
                  - { label: "IsThereAnyDeal (price history)", value: "itad" }
              - { label: "URL", name: "url", widget: "string", hint: "For ITAD, paste the URL from the real ITAD page — slugs can't be guessed." }
      - name: "image"
        widget: "object"
        required: false
        fields:
          - { label: "Image", name: "url", widget: "image", required: false }
          - { label: "Alt Text", name: "alt", widget: "string", required: false }
          - { label: "Filename", name: "filename", widget: "string", required: false, pattern: ['^[^\\s]*$', 'Filename should not contain spaces'] }
      - { label: "Body", name: "body", widget: "markdown" }