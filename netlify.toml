# Netlify configuration.
#
# Redirects for consolidated tag pages (tag casing/synonym normalisation, ISSUES.md §5).
# These tag routes are no longer generated, so 301 them to their canonical form to keep
# any previously-published or indexed URLs alive — never break a published URL (CLAUDE.md §1).
# This is the project's first netlify.toml (previously flagged missing in ISSUES.md §3i).

[build.environment]
  # Netlify defaulted to Node 18 (EOL Apr 2025), which fails the build with the current
  # dependency set — while local (Node 24) builds fine. Pin a modern version to kill that
  # divergence. Node 22 is current LTS and satisfies modern tooling, including the coming
  # Astro 7 / Vite 8 requirement (Node 20.19+ / 22.12+). Bump to "24" to mirror local exactly.
  NODE_VERSION = "22"

[[redirects]]
  from = "/tags/RPG"
  to = "/tags/rpg/"
  status = 301

[[redirects]]
  from = "/tags/itch.io"
  to = "/tags/itch/"
  status = 301

# Post slug renames (filenames aligned to the "Month Year - Title" scheme, 2026-07-26).
# 301 the old published URLs to the new ones so nothing 404s (CLAUDE.md §1).
[[redirects]]
  from = "/posts/01-25_monthly-update"
  to = "/posts/january-2025-cruel-for-me-mule/"
  status = 301

[[redirects]]
  from = "/posts/biweekly-bipartisan-bisexual-roundup-1"
  to = "/posts/august-2024-clickolding-is-a-fever-dream/"
  status = 301

[[redirects]]
  from = "/posts/biweekly-bipartisan-bisexual-roundup-2"
  to = "/posts/september-2024-path-of-achra-is-perfect/"
  status = 301

[[redirects]]
  from = "/posts/biweekly-bipartisan-bisexual-roundup-3"
  to = "/posts/october-2024-you-should-play-arco/"
  status = 301

# Typo fix: "dunegons" -> "dungeons".
[[redirects]]
  from = "/posts/dunegons-of-hinterberg-review"
  to = "/posts/dungeons-of-hinterberg-review/"
  status = 301

# The "Featured" feature was removed (2026-07-26): the homepage now heros the most recent
# post. 301 the retired /featured page to the homepage so its published URL keeps working.
[[redirects]]
  from = "/featured"
  to = "/"
  status = 301

# The orphan "featured" content tag was dropped with the feature; its tag page no longer
# generates. 301 it to the archive (the closest browse-all-posts equivalent).
[[redirects]]
  from = "/tags/featured"
  to = "/archive"
  status = 301
